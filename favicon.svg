<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Expenze">
  <rect width="64" height="64" rx="13" fill="#1E7047"/>
  <!-- Three bars rather than a letter E drawn in a font.
       A glyph at 16px is at the mercy of whatever the renderer does with
       hinting; three rectangles are the same three rectangles everywhere, and
       they read as both an E and a receipt's lines, which is what the product
       does. The middle bar is shorter, as an E's is. -->
  <g fill="#FFFFFF">
    <rect x="17" y="16" width="30" height="7.5" rx="3.2"/>
    <rect x="17" y="28.25" width="21" height="7.5" rx="3.2"/>
    <rect x="17" y="40.5" width="30" height="7.5" rx="3.2"/>
  </g>
</svg>
